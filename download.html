    <meta charset="UTF-8">

    <title>Download Layovered App</title>
    <meta name="robots" content="noindex, follow">
    <script>
        window.onload = function () {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;

            if (/android/i.test(userAgent)) {
                // Redirect to Google Play Store
                window.location.href = "http://play.google.com/store/apps/details?id=com.layovered";
            } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                // Redirect to Apple App Store
                window.location.href = "https://apps.apple.com/us/app/layovered/id6602894094";
            } else {
                // Redirect to main site or show manual download options
                window.location.href = "http://play.google.com/store/apps/details?id=com.layovered";
            }
        };
    </script>
